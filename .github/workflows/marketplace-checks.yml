name: Marketplace checks

on:
    pull_request:
    push:
        branches: [master, 'v*']

permissions:
    contents: read

concurrency:
    group: marketplace-checks-${{ github.ref }}
    cancel-in-progress: true

jobs:
    package-verification:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: '8.3'
                    tools: composer
                    coverage: none

            -   name: Validate package manifest
                run: composer validate Packetery/Checkout/composer.json

            -   name: Verify the manifest against the Marketplace rules
                run: php bin/verify-manifest

            -   name: Verify composer.json and CHANGE_LOG.txt versions agree
                run: |
                    MANIFEST=$(php -r 'echo json_decode(file_get_contents("Packetery/Checkout/composer.json"))->version;')
                    CHANGELOG=$(awk 'NR==1{print $1}' CHANGE_LOG.txt)
                    echo "composer.json: $MANIFEST, CHANGE_LOG.txt: $CHANGELOG"
                    [ -n "$MANIFEST" ] || { echo "FAIL: composer.json has no version"; exit 1; }
                    [ "$MANIFEST" = "$CHANGELOG" ] || { echo "FAIL: composer.json ($MANIFEST) != CHANGE_LOG.txt top ($CHANGELOG)"; exit 1; }

            -   name: Enforce package zip under 30 MB
                run: |
                    set -o pipefail
                    SIZE=$(cd Packetery/Checkout && zip -rq - . -x '.git/*' | wc -c)
                    echo "package zip: $((SIZE / 1024)) KB"
                    if [ "$SIZE" -gt $((30 * 1024 * 1024)) ]; then
                        echo "FAIL: package $((SIZE / 1024 / 1024)) MB > 30 MB"; exit 1
                    fi

            -   name: Forbid TODO and FIXME markers
                run: |
                    HITS=$(grep -rIniE '\b(TODO|FIXME)\b' \
                        --include='*.php' --include='*.phtml' --include='*.xml' --include='*.js' \
                        Packetery/Checkout | grep -v '/Test/' || true)
                    if [ -n "$HITS" ]; then
                        echo "FAIL: TODO/FIXME found:"; echo "$HITS"; exit 1
                    fi
                    echo "OK: no TODO/FIXME"

    coding-standard:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: '8.4'
                    tools: composer
                    coverage: none

            -   name: Install Magento coding standard and phpcpd
                run: |
                    mkdir -p .mp-tools
                    composer --working-dir=.mp-tools init --no-interaction --name=packetery/mp-tools
                    composer --working-dir=.mp-tools config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
                    composer --working-dir=.mp-tools require --no-interaction \
                        "magento/magento-coding-standard:^40" "systemsdk/phpcpd:^9.0"

            -   name: Code sniffer (Magento2, blocking errors only)
                run: |
                    .mp-tools/vendor/bin/phpcs --standard=Magento2 \
                        --error-severity=10 --warning-severity=0 \
                        --extensions=php,phtml --ignore-annotations Packetery/Checkout

            -   name: Copy-paste detector (advisory)
                continue-on-error: true
                run: .mp-tools/vendor/bin/phpcpd --exclude Packetery/Checkout/Test Packetery/Checkout

    copy-paste-vs-core:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # Advisory for now: findings are reported and assessed by hand.
        # It turns blocking once we know they are not false positives.
        continue-on-error: true
        env:
            MAGENTO_CORE_VERSION: '2.4.9'
        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: '8.4'
                    tools: composer
                    coverage: none

            -   name: Install the marketplace tools
                # --no-dev: the job runs phpcpd from tools/, the root dev tools are only dead weight here.
                run: composer install --no-dev --no-interaction --no-progress

            -   name: Restore the Magento core checkout
                id: core-cache
                uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
                with:
                    path: magento-core
                    key: magento-core-${{ env.MAGENTO_CORE_VERSION }}-${{ hashFiles('.github/workflows/marketplace-checks.yml') }}

            -   name: Clone the Magento core
                if: steps.core-cache.outputs.cache-hit != 'true'
                # Sparse checkout of the two source trees, then only the php files are kept:
                # 364 MB of clone shrinks to 112 MB of cache and phpcpd reads nothing else.
                run: |
                    git clone --depth 1 --branch "$MAGENTO_CORE_VERSION" --filter=blob:none --sparse \
                        https://github.com/magento/magento2.git magento-core
                    git -C magento-core sparse-checkout set app/code/Magento lib/internal/Magento
                    rm -rf magento-core/.git
                    find magento-core -type f ! -name '*.php' -delete

            -   name: Copy-paste detector against core
                run: |
                    bash bin/phpcpd-core \
                        magento-core/app/code/Magento \
                        magento-core/lib/internal/Magento

    php-lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                # source of truth for the PHP versions we claim to support, bin/verify-manifest
                # compares the manifest constraint against it
                php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: none

            -   name: Lint PHP sources
                run: |
                    find Packetery/Checkout -name '*.php' -not -path '*/vendor/*' -print0 \
                        | xargs -0 -n1 -P4 php -l >/dev/null

    php-compatibility:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: '8.4'
                    tools: composer
                    coverage: none

            -   name: Install dev tooling
                # --no-scripts: this job only needs the root PHPCompatibility ruleset, not the
                # marketplace tools that the root post-install hook would pull into tools/.
                run: composer install --no-interaction --no-progress --no-scripts

            -   name: PHPCompatibility 8.1 to 8.5
                run: |
                    for v in 8.1 8.2 8.3 8.4 8.5; do
                        echo "== testVersion $v =="
                        bash bin/phpcs-compatibility "$v"
                    done

    malware-scan:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            # the YARA rules are pinned so the run is reproducible: updating them is a commit here,
            # not whatever the ruleset happens to look like on the day the job runs
            YARA_RULES_COMMIT: '87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f'
        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   name: Install YARA and ClamAV
                run: |
                    sudo apt-get update
                    sudo apt-get install --no-install-recommends -y yara clamav

            -   name: Check out the pinned YARA rules
                # only data/ is checked out; its samples come with it and are deleted right after,
                # because they are live webshells and no step here needs them
                run: |
                    git clone --filter=blob:none --no-checkout --sparse \
                        https://github.com/jvoisin/php-malware-finder.git /tmp/yara-rules
                    git -C /tmp/yara-rules sparse-checkout set data
                    git -C /tmp/yara-rules checkout "$YARA_RULES_COMMIT"
                    rm -rf /tmp/yara-rules/data/samples

            -   name: YARA scan of the module sources
                # yara reports a match on standard output and still exits 0, so the output decides
                run: |
                    HITS=$(yara -w -r /tmp/yara-rules/data/php.yar Packetery/Checkout)
                    if [ -n "$HITS" ]; then
                        echo "FAIL: YARA findings:"; echo "$HITS"; exit 1
                    fi
                    echo "OK: no YARA findings"

            -   name: Update the ClamAV signature database
                # the package brings the clamav-freshclam service along, which holds a lock
                # on the database directory and makes a manual freshclam fail
                run: |
                    sudo systemctl stop clamav-freshclam || true
                    sudo freshclam

            -   name: ClamAV scan of the module sources
                # exit 1 means an infected file, exit 2 a scan error, and both have to fail the job
                run: clamscan -r -i Packetery/Checkout
